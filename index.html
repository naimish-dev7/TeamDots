<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TeamDots — Autonomous AI Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --border: #eaeaea;
      --border-focus: #111111;
      --text: #09090b;
      --text-muted: #71717a;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      letter-spacing: -0.02em;
    }

    /* Top Navigation */
    header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .brand-circle {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .badge-tag {
      font-family: 'Geist Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .actions-wrap { display: flex; gap: 6px; }
    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
    }
    .btn-icon:hover { background: var(--surface); color: var(--text); }

    /* Agent Switcher Bar */
    .agent-nav {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
      scrollbar-width: none;
    }
    .agent-nav::-webkit-scrollbar { display: none; }
    .pill {
      font-size: 0.76rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Canvas */
    #canvas {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--surface);
    }
    .hero-center {
      margin: auto;
      text-align: center;
      max-width: 380px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .avatar-cluster { display: flex; gap: 8px; margin-bottom: 4px; }
    .hero-title { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.03em; }
    .hero-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }

    /* Messages */
    .chat-row {
      display: flex;
      gap: 10px;
      max-width: 96%;
      align-self: flex-start;
      width: 100%;
    }
    .chat-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
      max-width: 85%;
    }
    .avatar-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .msg-content {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 0.86rem;
      line-height: 1.5;
      word-break: break-word;
      flex: 1;
      position: relative;
    }
    .chat-row.user .msg-content {
      background: #000;
      color: #fff;
      border-color: #000;
      border-bottom-right-radius: 2px;
      white-space: pre-wrap;
    }

    /* Agent Meta & Badge Directives */
    .agent-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
    }
    .agent-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      font-family: 'Geist Mono', monospace;
    }
    .agent-tool-status {
      font-size: 0.65rem;
      font-family: 'Geist Mono', monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Code Container & Instant Copy */
    .code-container {
      position: relative;
      background: #0f172a;
      border-radius: 8px;
      margin-top: 8px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .code-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: #94a3b8;
      font-family: 'Geist Mono', monospace;
    }
    .btn-copy {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: 'Geist', sans-serif;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-copy:active { background: #10b981; }
    pre {
      padding: 12px;
      color: #e2e8f0;
      font-family: 'Geist Mono', monospace;
      font-size: 0.78rem;
      overflow-x: auto;
      white-space: pre;
    }

    /* Image Attachment Dock */
    .img-preview-tray {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #ffffff;
      border-top: 1px solid var(--border);
    }
    .img-preview-tray img {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .dock {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
    }
    .dock-box {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
    }
    .dock-box:focus-within { border-color: var(--border-focus); }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.86rem;
      resize: none;
      height: 48px;
      background: transparent;
      color: var(--text);
    }
    .dock-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-top: 1px solid #f6f6f6;
    }
    .left-tools { display: flex; gap: 6px; }
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-send {
      background: #000;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-send:disabled { opacity: 0.4; }

    footer {
      height: 22px;
      padding: 0 16px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-muted);
    }
    .watermark { font-family: 'Geist Mono', monospace; color: #a1a1aa; }

    /* Settings Modal */
    .modal-shade {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 360px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .btn-modal-close {
      width: 100%;
      background: #000;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <div class="brand-circle"></div>
      <span>TeamDots</span>
      <span class="badge-tag">AGENCY OS</span>
    </div>
    <div class="actions-wrap">
      <button class="btn-icon" onclick="resetCanvas()" title="Clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button class="btn-icon" onclick="toggleSettings(true)" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </div>
  </header>

  <!-- Agent Switcher -->
  <div class="agent-nav">
    <button class="pill active" onclick="pickAgent('all', this)">⚡ All Dots (Collab Debate)</button>
    <button class="pill" onclick="pickAgent('nexus', this)">Nexus (Plan)</button>
    <button class="pill" onclick="pickAgent('cypher', this)">Cypher (Code)</button>
    <button class="pill" onclick="pickAgent('aegis', this)">Aegis (Audit)</button>
    <button class="pill" onclick="pickAgent('prism', this)">Prism (Style)</button>
    <button class="pill" onclick="pickAgent('sleep', this)">🌙 Overnight Queue</button>
  </div>

  <!-- Workspace Canvas -->
  <div id="canvas">
    <div id="heroCard" class="hero-center">
      <div class="avatar-cluster">
        <!-- Nexus Avatar -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#4338CA"/><circle cx="15" cy="11" r="1.5" fill="#4338CA"/><path d="M10 15h4" stroke="#4338CA" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- Cypher Avatar -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><path d="M8 10l2 2-2 2" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="14" x2="16" y2="14" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- Aegis Avatar -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#B45309"/><circle cx="15" cy="11" r="1.5" fill="#B45309"/><path d="M9 15c1 1 5 1 6 0" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- Prism Avatar -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#BE185D"/><circle cx="15" cy="11" r="1.5" fill="#BE185D"/><line x1="11" y1="15" x2="13" y2="15" stroke="#BE185D" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="hero-title">TeamDots Agency Workspace</div>
      <div class="hero-desc">Interactive AI squad. Watch them plan, build, audit, and patch each other's code in real-time.</div>
    </div>
  </div>

  <!-- Attachment Tray -->
  <div id="fileTray" class="img-preview-tray">
    <img id="thumbImg" src="" alt="file"/>
    <span id="thumbLabel" style="font-size:0.75rem; color:var(--text-muted); flex:1;"></span>
    <button onclick="detachFile()" style="font-size:0.7rem; color:#ef4444; border:none; background:none; cursor:pointer;">Remove</button>
  </div>

  <!-- Dock Input -->
  <div class="dock">
    <div class="dock-box">
      <textarea id="dockInput" placeholder="Give your dots an objective..."></textarea>
      <div class="dock-actions">
        <div class="left-tools">
          <input type="file" id="filePicker" accept="image/*" style="display:none;" onchange="onFileSelected(event)" />
          <button class="tool-btn" onclick="document.getElementById('filePicker').click()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            Attach
          </button>
          <button class="tool-btn" onclick="enhanceDraft()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/></svg>
            Enhance
          </button>
        </div>
        <button id="execBtn" class="btn-send" onclick="startWorkflow()">Run</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <span id="statusMessage">Ready</span>
    <span class="watermark">built by naimish dev</span>
  </footer>

  <!-- Settings Modal -->
  <div id="settingsBox" class="modal-shade">
    <div class="modal-card">
      <div class="modal-head">
        <span>Workspace Settings</span>
        <span style="cursor:pointer;" onclick="toggleSettings(false)">✕</span>
      </div>
      <div class="field">
        <label>Gemini API Key</label>
        <input type="password" id="keyField" placeholder="Paste free key (AIza...)" oninput="persistSettings()" />
      </div>
      <div class="field">
        <label>Primary Model Engine</label>
        <select id="modelField" onchange="persistSettings()">
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Latest & Required)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash (Stable)</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B</option>
        </select>
      </div>
      <button class="btn-modal-close" onclick="toggleSettings(false)">Save & Close</button>
    </div>
  </div>

  <script>
    let currentDot = 'all';
    let fileBase64 = null;
    let fileMime = null;

    // Agent Directives & Direct Personas
    const TEAM = {
      nexus: {
        name: "Nexus",
        role: "SYSTEM ARCHITECT",
        tool: "SYSTEM_SPEC",
        avatar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#4338CA"/><circle cx="15" cy="11" r="1.5" fill="#4338CA"/><path d="M10 15h4" stroke="#4338CA" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        prompt: "You are Nexus, Lead Systems Architect at TeamDots. Analyze the user's objective and deliver an uncompromising, numbered technical execution blueprint. Specify components, data flow, and architecture. Address Cypher directly with precise instructions for implementation."
      },
      cypher: {
        name: "Cypher",
        role: "FULL-STACK CODER",
        tool: "COMPILER_ENGINE",
        avatar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><path d="M8 10l2 2-2 2" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="14" x2="16" y2="14" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        prompt: "You are Cypher, Lead Software Engineer at TeamDots. Transform the architectural plan into complete, production-ready, bug-free code. Never use placeholders or truncation comments like '// rest of code here'. When addressing teammates (Aegis, Nexus, Prism), speak directly to them about technical trade-offs. Wrap all code in standard triple-backtick markdown blocks."
      },
      aegis: {
        name: "Aegis",
        role: "SECURITY & QA",
        tool: "AUDIT_VERIFY",
        avatar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#B45309"/><circle cx="15" cy="11" r="1.5" fill="#B45309"/><path d="M9 15c1 1 5 1 6 0" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        prompt: "You are Aegis, Security & Quality Auditor at TeamDots. Audit the code strictly for syntax bugs, XSS vulnerabilities, edge cases, mobile viewport issues, and performance bottlenecks. Speak directly to Cypher. Detail concrete flaws and give an explicit verdict: [APPROVED] or [REVISION REQUIRED]."
      },
      prism: {
        name: "Prism",
        role: "CREATIVE LEAD",
        tool: "GEIST_UI",
        avatar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="#BE185D"/><circle cx="15" cy="11" r="1.5" fill="#BE185D"/><line x1="11" y1="15" x2="13" y2="15" stroke="#BE185D" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        prompt: "You are Prism, Head of Design at TeamDots. Provide modern layout recommendations, CSS micro-interactions, responsive mobile styling, and Geist-inspired color palettes. Address Cypher directly regarding visual aesthetics and UI structure."
      }
    };

    window.onload = () => {
      const k = localStorage.getItem("td_key");
      const m = localStorage.getItem("td_model");
      if (k) document.getElementById("keyField").value = k;
      if (m) document.getElementById("modelField").value = m;
    };

    function persistSettings() {
      localStorage.setItem("td_key", document.getElementById("keyField").value.trim());
      localStorage.setItem("td_model", document.getElementById("modelField").value);
    }

    function toggleSettings(open) {
      document.getElementById("settingsBox").style.display = open ? 'flex' : 'none';
    }

    function pickAgent(mode, btn) {
      currentDot = mode;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
    }

    function resetCanvas() {
      location.reload();
    }

    function onFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      fileMime = file.type;
      const reader = new FileReader();
      reader.onload = (evt) => {
        fileBase64 = evt.target.result.split(',')[1];
        document.getElementById("thumbImg").src = evt.target.result;
        document.getElementById("thumbLabel").textContent = file.name;
        document.getElementById("fileTray").style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function detachFile() {
      fileBase64 = null;
      fileMime = null;
      document.getElementById("fileTray").style.display = 'none';
      document.getElementById("filePicker").value = '';
    }

    function parseAndFormatResponse(raw) {
      const wrapper = document.createElement("div");
      const codeRegex = /```([a-zA-Z0-9]*)\n([\s\S]*?)```/g;
      let lastIdx = 0;
      let match;

      while ((match = codeRegex.exec(raw)) !== null) {
        const textBefore = raw.substring(lastIdx, match.index);
        if (textBefore.trim()) {
          const p = document.createElement("div");
          p.style.whiteSpace = "pre-wrap";
          p.textContent = textBefore;
          wrapper.appendChild(p);
        }

        const lang = match[1] || "code";
        const codeSnippet = match[2];

        const container = document.createElement("div");
        container.className = "code-container";

        const bar = document.createElement("div");
        bar.className = "code-bar";
        bar.innerHTML = `<span>${lang}</span>`;

        const copyBtn = document.createElement("button");
        copyBtn.className = "btn-copy";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = function() {
          navigator.clipboard.writeText(codeSnippet).then(() => {
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 2000);
          });
        };

        bar.appendChild(copyBtn);
        container.appendChild(bar);

        const pre = document.createElement("pre");
        pre.textContent = codeSnippet;
        container.appendChild(pre);

        wrapper.appendChild(container);
        lastIdx = match.index + match[0].length;
      }

      const remainingText = raw.substring(lastIdx);
      if (remainingText.trim()) {
        const p = document.createElement("div");
        p.style.whiteSpace = "pre-wrap";
        p.textContent = remainingText;
        wrapper.appendChild(p);
      }

      return wrapper;
    }

    function appendBubble(text, isUser, dotKey = null) {
      const hero = document.getElementById("heroCard");
      if (hero) hero.remove();

      const canvas = document.getElementById("canvas");
      const row = document.createElement("div");
      row.className = "chat-row " + (isUser ? "user" : "");

      if (!isUser && dotKey && TEAM[dotKey]) {
        const avatar = document.createElement("div");
        avatar.className = "avatar-box";
        avatar.innerHTML = TEAM[dotKey].avatar;
        row.appendChild(avatar);
      }

      const body = document.createElement("div");
      body.className = "msg-content";

      if (!isUser && dotKey && TEAM[dotKey]) {
        const meta = document.createElement("div");
        meta.className = "agent-meta-bar";
        meta.innerHTML = `
          <span class="agent-tag">${TEAM[dotKey].name} •${TEAM[dotKey].role}</span>
          <span class="agent-tool-status">${TEAM[dotKey].tool}</span>
        `;
        body.appendChild(meta);
      }

      if (isUser) {
        body.textContent = text;
      } else {
        body.appendChild(parseAndFormatResponse(text));
      }

      row.appendChild(body);
      canvas.appendChild(row);
      canvas.scrollTop = canvas.scrollHeight;
    }

    // Dynamic Multi-Tier Network Engine with Gemini 3.8 Flash & Fallback Chain
    async function sendToGemini(systemPrompt, userText, img64 = null, mime = null) {
      const key = document.getElementById("keyField").value.trim();
      const selectedModel = document.getElementById("modelField").value;
      if (!key) {
        toggleSettings(true);
        throw new Error("Paste your Gemini API key in Settings (⚙️)");
      }

      const modelChain = [selectedModel, "gemini-3.8-flash", "gemini-2.0-flash", "gemini-1.5-flash-8b"];
      const uniqueModels = [...new Set(modelChain)];

      const parts = [{ text: userText }];
      if (img64 && mime) {
        parts.push({
          inlineData: { mimeType: mime, data: img64 }
        });
      }

      const payload = {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: "user", parts: parts }]
      };

      let lastError = null;

      for (const model of uniqueModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            }

            const msg = data.error?.message || "";
            lastError = msg;

            if (response.status === 503 || response.status === 429 || msg.includes("high demand") || msg.includes("no longer available")) {
              await new Promise(r => setTimeout(r, 1200));
              continue;
            }

            throw new Error(msg);
          } catch (err) {
            lastError = err.message;
            if (!err.message.includes("high demand") && !err.message.includes("503") && !err.message.includes("no longer available")) {
              throw err;
            }
          }
        }
      }

      throw new Error(`API Busy: ${lastError}`);
    }

    async function enhanceDraft() {
      const input = document.getElementById("dockInput");
      const draft = input.value.trim();
      if (!draft) return alert("Write a brief prompt first.");

      document.getElementById("statusMessage").textContent = "Enhancing...";
      try {
        const enhanced = await sendToGemini(
          "You are an expert prompt engineer. Expand the user's short brief into an exhaustive technical specification prompt suitable for full autonomous coding. Return ONLY the enhanced text.",
          draft
        );
        input.value = enhanced;
        document.getElementById("statusMessage").textContent = "Prompt enhanced";
      } catch (err) {
        alert(err.message);
        document.getElementById("statusMessage").textContent = "Idle";
      }
    }

    // Multi-Agent Pipeline & Conversational Debate Loop
    async function startWorkflow() {
      const input = document.getElementById("dockInput");
      const rawPrompt = input.value.trim();
      const btn = document.getElementById("execBtn");
      const status = document.getElementById("statusMessage");

      if (!rawPrompt && !fileBase64) return;

      const img = fileBase64;
      const mime = fileMime;

      input.value = "";
      btn.disabled = true;
      detachFile();

      try {
        // Mode 1: Overnight Autonomous Queue
        if (currentDot === 'sleep') {
          const list = rawPrompt.split('\n').map(t => t.trim()).filter(Boolean);
          appendBubble(`🌙 Autonomous Queue initiated: ${list.length} task(s). Keep browser active.`, true);

          for (let i = 0; i < list.length; i++) {
            status.textContent = `Queue (${i+1}/${list.length})`; appendBubble(`[Task ${i+1}/${list.length}]${list[i]}`, true);

            const plan = await sendToGemini(TEAM.nexus.prompt, list[i]);
            appendBubble(plan, false, 'nexus');

            const code = await sendToGemini(TEAM.cypher.prompt, `Objective: ${list[i]}\nNexus Architecture:\n${plan}`);
            appendBubble(code, false, 'cypher');
          }
          status.textContent = "Queue finished";
        }
        // Mode 2: Multi-Agent Interactive Debate & Collaboration
        else if (currentDot === 'all') {
          appendBubble(rawPrompt, true);

          // 1. Nexus outlines the technical architecture
          status.textContent = "Nexus is architecting blueprint...";
          const plan = await sendToGemini(TEAM.nexus.prompt, `User Objective: ${rawPrompt}`, img, mime);
          appendBubble(plan, false, 'nexus');

          // 2. Prism reviews architecture and supplies design specs
          status.textContent = "Prism is designing UI/UX tokens...";
          const designDirective = await sendToGemini(
            TEAM.prism.prompt,
            `Nexus has produced this architecture for the objective "${rawPrompt}":\n\n${plan}\n\nAddress Cypher directly. Provide precise UI styling, modern layout rules, responsive mobile considerations, and color aesthetics.`
          );
          appendBubble(designDirective, false, 'prism');

          // 3. Cypher builds the full initial implementation
          status.textContent = "Cypher is compiling implementation...";
          const initialCode = await sendToGemini(
            TEAM.cypher.prompt,
            `Objective: ${rawPrompt}\n\nNexus Architecture:\n${plan}\n\nPrism Design Directives:\n${designDirective}\n\nAddress your teammates directly and write the complete, functional code.`
          );
          appendBubble(initialCode, false, 'cypher');

          // 4. Aegis audits the code and speaks directly to Cypher
          status.textContent = "Aegis is auditing security & syntax...";
          const auditCritique = await sendToGemini(
            TEAM.aegis.prompt,
            `Cypher just produced this code for the task "${rawPrompt}":\n\n${initialCode}\n\nAudit this rigorously. Address Cypher directly. Identify any flaws, edge cases, mobile bugs, or security gaps. If completely flawless, write [APPROVED]. Otherwise, write [REVISION REQUIRED] with specific fixes.`
          );
          appendBubble(auditCritique, false, 'aegis');

          // 5. Cypher patches feedback if revisions were requested
          if (!auditCritique.includes("[APPROVED]")) {
            status.textContent = "Cypher is patching code based on Aegis's audit...";
            const patchedCode = await sendToGemini(
              TEAM.cypher.prompt,
              `Aegis reviewed your code and requested these changes:\n\n${auditCritique}\n\nReply directly to Aegis, acknowledge the fixes, and output the complete, fully patched code.`
            );
            appendBubble(patchedCode, false, 'cypher');
          }

          status.textContent = "Consensus reached";
        }
        // Mode 3: Direct 1-on-1 with Specific Agent
        else {
          appendBubble(rawPrompt, true);
          status.textContent = `${TEAM[currentDot].name} working...`;
          const reply = await sendToGemini(TEAM[currentDot].prompt, rawPrompt, img, mime);
          appendBubble(reply, false, currentDot);
          status.textContent = "Ready";
        }
      } catch (e) {
        appendBubble("System Alert: " + e.message, false, 'aegis');
        status.textContent = "Failed";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
